[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[program:Xvfb]
command=Xvfb :0 -screen 0 1280x800x24
autostart=true
autorestart=true

[program:fluxbox]
command=fluxbox
environment=DISPLAY=:0.0
autostart=true
autorestart=true

[program:x11vnc]
command=x11vnc -display :0.0 -forever -nopw -shared
autostart=true
autorestart=true

[program:noVNC]
command=/opt/noVNC/utils/novnc_proxy --vnc localhost:5900 --listen 6080
autostart=true
autorestart=true

[program:jupyter]
command=python3 -m notebook --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token='' --NotebookApp.password='' --NotebookApp.allow_origin='*'
environment=DISPLAY=:0.0
autostart=true
autorestart=false

[program:xterm]
command=xterm
environment=DISPLAY=:0.0
autostart=true
autorestart=false

[program:falkon-in-xterm]
command=xterm -e sh -c "falkon http://localhost:8888 --no-sandbox"
environment=DISPLAY=:0.0
autostart=true
autorestart=false
stdout_logfile=/tmp/falkon.out.log
stderr_logfile=/tmp/falkon.err.log

[program:context_capture]
command=sh -c "mkdir -p /workspace && mkdir -p /workspace/.debug && cp /opt/context/*.py /workspace/.debug/ && cd /workspace && PYTHONPATH=/workspace/.debug python3 -c 'import auto_capture; import os; job_id=os.environ.get(\"JOB_ID\"); print(f\"Starting context capture for job: {job_id}\"); auto_capture.start_auto_capture(job_id) if job_id else print(\"No JOB_ID found\"); import time; time.sleep(3600)' & (while true; do if [ -d \"/tmp/jobs/\$JOB_ID/context\" ]; then cp -r /tmp/jobs/\$JOB_ID/context/* /workspace/context/ 2>/dev/null || true; fi; sleep 10; done)"
environment=DISPLAY=:0.0,PYTHONPATH=/workspace/.debug
autostart=true
autorestart=true


