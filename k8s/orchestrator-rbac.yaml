apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: code-capsule
  name: orchestrator-job-manager
rules:
- apiGroups: ["batch"]
  resources: ["jobs", "jobs/status"]
  verbs: ["create", "get", "list", "watch", "delete"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["services"]
  verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: orchestrator-job-manager-binding
  namespace: code-capsule
subjects:
- kind: ServiceAccount
  name: default
  namespace: code-capsule
roleRef:
  kind: Role
  name: orchestrator-job-manager
  apiGroup: rbac.authorization.k8s.io
